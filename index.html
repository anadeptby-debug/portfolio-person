<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Портфолио</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#ffffff);
  --bg2:var(--tg-theme-secondary-bg-color,#f2f3f5);
  --card:var(--tg-theme-section-bg-color,#ffffff);
  --text:var(--tg-theme-text-color,#15171a);
  --hint:var(--tg-theme-hint-color,#6d7480);
  --link:var(--tg-theme-link-color,#2a7ae4);
  --accent:var(--tg-theme-button-color,#2a7ae4);
  --accent-text:var(--tg-theme-button-text-color,#ffffff);
  --sep:color-mix(in srgb,var(--hint) 22%,transparent);
  --radius:14px;
}
@media (prefers-color-scheme:dark){:root:not(.tg){
  --bg:#17191d;--bg2:#0f1114;--card:#1f2227;--text:#eceef1;--hint:#9aa1ac;--link:#6aa8ff;--accent:#4b8df0;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg2);color:var(--text);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
a{color:var(--link);text-decoration:none}
h1{font-size:24px;line-height:1.2;margin:0}
h2{font-size:15px;font-weight:600;color:var(--hint);margin:28px 4px 10px}
p{margin:0}
.hero{display:flex;gap:14px;align-items:center;padding:8px 4px 4px}
.ava{width:72px;height:72px;border-radius:50%;flex:none;object-fit:cover;background:var(--accent);color:var(--accent-text);
  display:grid;place-items:center;font-size:28px;font-weight:600}
.role{color:var(--hint);margin-top:4px}
.about{margin:16px 4px 0}
.loc{color:var(--hint);font-size:14px;margin:8px 4px 0}
.list{background:var(--card);border-radius:var(--radius);overflow:hidden}
.item{display:block;width:100%;text-align:left;border:0;background:none;color:inherit;font:inherit;
  padding:14px 16px;border-top:1px solid var(--sep);cursor:pointer}
.item:first-child{border-top:0}
.item:active{background:color-mix(in srgb,var(--hint) 10%,transparent)}
.item .t{font-weight:600}
.item .d{color:var(--hint);font-size:14px;margin-top:2px}
.case-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.metric{text-align:right;flex:none}
.metric b{display:block;font-size:20px;line-height:1.1;color:var(--accent);white-space:nowrap}
.metric span{font-size:12px;color:var(--hint);display:block;max-width:110px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:12px;padding:2px 8px;border-radius:8px;background:var(--bg2);color:var(--hint)}
.tag.own{color:var(--accent)}
.steps{counter-reset:s;background:var(--card);border-radius:var(--radius);padding:4px 0}
.steps li{list-style:none;counter-increment:s;padding:10px 16px 10px 52px;position:relative}
.steps li::before{content:counter(s);position:absolute;left:16px;top:9px;width:24px;height:24px;border-radius:50%;
  background:var(--bg2);color:var(--hint);font-size:13px;display:grid;place-items:center}
.detail .block{background:var(--card);border-radius:var(--radius);padding:14px 16px;margin-top:12px}
.detail h1{margin-top:6px}
.detail ul{margin:6px 0 0;padding-left:20px}
.detail li{margin:4px 0}
.label{font-size:13px;color:var(--hint);margin-bottom:4px}
.big{display:flex;gap:12px;align-items:baseline;margin-top:10px}
.big b{font-size:30px;color:var(--accent);line-height:1;white-space:nowrap}
.fallback{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:var(--bg);border-top:1px solid var(--sep)}
.fallback a{display:block;text-align:center;padding:13px;border-radius:12px;background:var(--accent);color:var(--accent-text);font-weight:600}
.hidden{display:none}
.back{border:0;background:none;color:var(--link);font:inherit;padding:4px;margin:0 0 4px -4px;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<div class="fallback hidden" id="fallback"><a id="contact" href="#" target="_blank" rel="noopener">Обсудить задачу в Telegram</a></div>
<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData !== undefined
    ? window.Telegram.WebApp : null;
  const inTelegram = !!(tg && tg.platform && tg.platform !== "unknown");
  if (inTelegram) { document.documentElement.classList.add("tg"); tg.ready(); tg.expand(); }

  const app = document.getElementById("app");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const KIND = { client: "Клиентский проект", own: "Свой проект", demo: "Демо" };
  let data = null;

  function contactUrl() { return "https://t.me/" + encodeURIComponent(data.profile.telegram || ""); }
  function openContact() {
    if (inTelegram) tg.openTelegramLink(contactUrl()); else window.open(contactUrl(), "_blank");
  }

  function setupContact() {
    if (inTelegram) {
      tg.MainButton.setText("Обсудить задачу");
      tg.MainButton.onClick(openContact);
      tg.MainButton.show();
    } else {
      document.getElementById("contact").href = contactUrl();
      document.getElementById("fallback").classList.remove("hidden");
    }
  }

  function caseRow(c) {
    const m = c.metric ? `<div class="metric"><b>${esc(c.metric.v)}</b><span>${esc(c.metric.l)}</span></div>` : "";
    return `<button class="item" data-case="${esc(c.id)}">
      <div class="case-top"><div><div class="t">${esc(c.title)}</div><div class="d">${esc(c.short || c.summary)}</div></div>${m}</div>
      <div class="tags"><span class="tag ${c.kind === "own" ? "own" : ""}">${esc(KIND[c.kind] || c.kind)}</span><span class="tag">${esc(c.tag || "")}</span></div>
    </button>`;
  }

  function solRow(x) {
    return `<button class="item" data-sol="${esc(x.id)}"><div class="t">${esc(x.title)}</div><div class="d">${esc(x.short)}</div>
      ${x.demo_url ? `<div class="tags"><span class="tag own">Есть демо</span></div>` : ""}</button>`;
  }

  function solution(id) {
    const x = (data.solutions || []).find((v) => v.id === id);
    if (!x) return home();
    app.innerHTML = `<div class="view detail">
      ${inTelegram ? "" : `<button class="back" id="back">← Назад</button>`}
      <h1>${esc(x.title)}</h1>
      <div class="block"><div class="label">Какую задачу решает</div>${esc(x.pain)}</div>
      <div class="block"><div class="label">Что входит</div><ul>${x.includes.map((d) => `<li>${esc(d)}</li>`).join("")}</ul></div>
      ${x.fit ? `<div class="block"><div class="label">Кому подойдёт</div>${esc(x.fit)}</div>` : ""}
      ${x.demo_url ? `<div class="block"><a href="${esc(x.demo_url)}" target="_blank" rel="noopener">Попробовать демо</a></div>` : ""}
      <div class="block"><div class="label">Как начнём</div>Напишите пару строк о задаче — задам вопросы и предложу решение, срок и цену.</div>
    </div>`;
    const back = document.getElementById("back");
    if (back) back.addEventListener("click", () => { location.hash = ""; });
    if (inTelegram) tg.BackButton.show();
    window.scrollTo(0, 0);
  }

  function home() {
    const p = data.profile;
    const initials = (p.name || "?").split(/\s+/).map((w) => w[0]).slice(0, 2).join("");
    const ava = p.photo ? `<img class="ava" src="${esc(p.photo)}" alt="">` : `<div class="ava" aria-hidden="true">${esc(initials)}</div>`;
    const real = data.cases.filter((c) => c.kind !== "demo");
    const demos = data.cases.filter((c) => c.kind === "demo");
    const sols = data.solutions || [];
    app.innerHTML = `<div class="view">
      <div class="hero">${ava}<div><h1>${esc(p.name)}</h1><div class="role">${esc(p.role)}</div></div></div>
      <p class="about">${esc(p.about)}</p>
      ${p.location ? `<p class="loc">${esc(p.location)}</p>` : ""}
      ${sols.length ? `<h2>Решения под задачу</h2><div class="list">${sols.map(solRow).join("")}</div>` : ""}
      ${real.length ? `<h2>Мои проекты</h2><div class="list">${real.map(caseRow).join("")}</div>` : ""}
      ${demos.length ? `<h2>Демо — можно попробовать</h2><div class="list">${demos.map(caseRow).join("")}</div>` : ""}
      <h2>Как работаю</h2>
      <ol class="steps">${p.process.map((s) => `<li>${esc(s)}</li>`).join("")}</ol>
    </div>`;
    app.querySelectorAll("[data-case]").forEach((b) => b.addEventListener("click", () => { location.hash = "case/" + b.dataset.case; }));
    app.querySelectorAll("[data-sol]").forEach((b) => b.addEventListener("click", () => { location.hash = "s/" + b.dataset.sol; }));
    if (inTelegram) tg.BackButton.hide();
    window.scrollTo(0, 0);
  }

  function detail(id) {
    const c = data.cases.find((x) => x.id === id);
    if (!c) return home();
    const big = c.metric ? `<div class="big"><b>${esc(c.metric.v)}</b><span>${esc(c.metric.l)}</span></div>` : "";
    app.innerHTML = `<div class="view detail">
      ${inTelegram ? "" : `<button class="back" id="back">← Все проекты</button>`}
      <div class="tags"><span class="tag ${c.kind === "own" ? "own" : ""}">${esc(KIND[c.kind] || c.kind)}</span><span class="tag">${esc(c.tag || "")}</span></div>
      <h1>${esc(c.title)}</h1>
      ${big}
      ${c.task ? `<div class="block"><div class="label">Задача</div>${esc(c.task)}</div>` : ""}
      ${c.did && c.did.length ? `<div class="block"><div class="label">Что сделано</div><ul>${c.did.map((d) => `<li>${esc(d)}</li>`).join("")}</ul></div>` : ""}
      ${c.facts && c.facts.length ? `<div class="block"><div class="label">Результат</div><ul>${c.facts.map((d) => `<li>${esc(d)}</li>`).join("")}</ul></div>` : ""}
      ${c.stack ? `<div class="block"><div class="label">Стек</div>${esc(c.stack)}</div>` : ""}
      ${c.url ? `<div class="block"><a href="${esc(c.url)}" target="_blank" rel="noopener">Подробнее о проекте</a></div>` : ""}
    </div>`;
    const back = document.getElementById("back");
    if (back) back.addEventListener("click", () => { location.hash = ""; });
    if (inTelegram) tg.BackButton.show();
    window.scrollTo(0, 0);
  }

  function route() {
    const m = location.hash.match(/^#(case|s)\/([\w-]+)/);
    if (m && m[1] === "case") detail(m[2]); else if (m) solution(m[2]); else home();
  }

  fetch("portfolio.json", { cache: "no-cache" })
    .then((r) => r.json())
    .then((d) => {
      data = d;
      document.title = d.profile.name + " — портфолио";
      setupContact();
      if (inTelegram) tg.BackButton.onClick(() => { location.hash = ""; });
      // Ссылка вида t.me/<бот>/<app>?startapp=<id кейса> открывает сразу нужный проект
      const start = inTelegram && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
      if (start && !location.hash) {
        const isCase = d.cases.some((c) => c.id === start);
        location.hash = (isCase ? "case/" : "s/") + start;
      }
      window.addEventListener("hashchange", route);
      route();
    })
    .catch(() => { app.innerHTML = '<p class="about">Не удалось загрузить портфолио. Обновите страницу.</p>'; });
})();
</script>
</body>
</html>
