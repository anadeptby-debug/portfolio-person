<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Портфолио</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:var(--tg-theme-secondary-bg-color,#eef0f4);
  --surface:var(--tg-theme-section-bg-color,var(--tg-theme-bg-color,#ffffff));
  --text:var(--tg-theme-text-color,#14161b);
  --hint:var(--tg-theme-hint-color,#6b7280);
  --link:var(--tg-theme-link-color,#2f6fe4);
  --accent:var(--tg-theme-button-color,#2f6fe4);
  --on-accent:var(--tg-theme-button-text-color,#ffffff);
  /* оттенки из акцента — для макетов-«экранов» */
  --tint:color-mix(in srgb,var(--accent) 12%,var(--surface));
  --tint-2:color-mix(in srgb,var(--accent) 22%,var(--surface));
  --line:color-mix(in srgb,var(--hint) 20%,transparent);
  --up:#1f9d55; --down:#d64545;
  --display:"Unbounded",system-ui,sans-serif;
  --body:"Golos Text",-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not(.tg){
  --bg:#101216;--surface:#1a1d23;--text:#eceef2;--hint:#959cab;--link:#7aa7ff;--accent:#4c8bf5;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:20px 16px calc(100px + env(safe-area-inset-bottom))}
a{color:var(--link);text-decoration:none}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}

/* ---------- шапка ---------- */
.hero{padding:8px 4px 4px}
.hero-top{display:flex;gap:14px;align-items:center}
.ava{width:64px;height:64px;border-radius:20px;flex:none;object-fit:cover;background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center;font:700 22px/1 var(--display)}
.name{font:700 26px/1.1 var(--display);letter-spacing:-.01em;margin:0}
.role{color:var(--hint);margin-top:6px;font-size:15px}
.about{margin-top:18px;font-size:17px;line-height:1.5;max-width:34em}
.where{margin-top:10px;color:var(--hint);font-size:14px}

h2{font:500 18px/1.25 var(--display);margin:36px 4px 14px}
.sub{color:var(--hint);font-size:14px;margin:-8px 4px 14px}

/* ---------- карточки решений ---------- */
.grid{display:grid;gap:12px}
.card{display:block;width:100%;text-align:left;border:0;padding:0;background:var(--surface);border-radius:22px;overflow:hidden;cursor:pointer}
.card:active{transform:scale(.99)}
.card-body{padding:14px 18px 18px}
.card-title{font-weight:600;font-size:17px;line-height:1.3}
.card-text{color:var(--hint);font-size:14px;margin-top:4px}
.badge{display:inline-block;margin-top:10px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--tint);color:var(--accent)}
.badge.muted{color:var(--hint);background:color-mix(in srgb,var(--hint) 12%,transparent)}

/* ---------- мини-экраны ---------- */
.screen{background:var(--tint);padding:16px 18px;min-height:132px;display:flex;flex-direction:column;justify-content:center;gap:7px;font-size:13px;line-height:1.35}
.big .screen{min-height:190px;padding:22px;font-size:14px;border-radius:22px;gap:9px}
.msg{max-width:82%;padding:7px 11px;border-radius:14px;background:var(--surface)}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.msg.bot{border-bottom-left-radius:4px}
.msg small{display:block;color:var(--hint);font-size:11px;margin-top:2px}
.msg.me small{color:color-mix(in srgb,var(--on-accent) 75%,transparent)}
.ticket{background:var(--surface);border-radius:14px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.ticket b{font-weight:600}
.pill{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:5px 12px;font-weight:600;white-space:nowrap}
.ok{color:var(--up);font-weight:600}
.sheet{background:var(--surface);border-radius:12px;overflow:hidden;font-variant-numeric:tabular-nums}
.row{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:6px 11px;border-top:1px solid var(--line)}
.row:first-child{border-top:0;color:var(--hint);font-size:11px}
.row .up{color:var(--up)} .row .down{color:var(--down)}
.flow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.box{background:var(--surface);border-radius:12px;padding:8px 10px}
.box small{display:block;color:var(--hint);font-size:11px}
.arrow{width:26px;height:2px;background:var(--accent);position:relative}
.arrow::after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left:7px solid var(--accent);border-right:0}
.notice{background:var(--surface);border-radius:12px;padding:7px 10px;display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--up);flex:none}
.answer{background:var(--surface);border-radius:14px;padding:10px 12px}
.answer .num{font:700 22px/1.1 var(--display);color:var(--accent)}
.answer small{color:var(--hint);font-size:11px;display:block;margin-top:3px}
.browser{background:var(--surface);border-radius:12px;overflow:hidden}
.bar{display:flex;gap:5px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line)}
.bar i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.bar span{margin-left:6px;flex:1;height:14px;border-radius:7px;background:var(--tint)}
.page{padding:12px;display:grid;grid-template-columns:1.3fr 1fr;gap:10px;align-items:center}
.page h4{margin:0;font:700 13px/1.2 var(--display)}
.page .lines span{display:block;height:6px;border-radius:3px;background:var(--line);margin-top:6px}
.page .lines span:last-child{width:60%}
.page .cta{background:var(--accent);color:var(--on-accent);border-radius:8px;padding:7px;text-align:center;font-weight:600;font-size:12px}
.radar{background:var(--surface);border-radius:14px;padding:10px 12px}
.radar .t{font-weight:600}
.radar .meta{color:var(--hint);font-size:11px;margin-top:2px}
.radar .score{float:right;font:700 16px/1 var(--display);color:var(--accent)}

/* ---------- проект ---------- */
.project{background:var(--surface);border-radius:22px;overflow:hidden}

/* ---------- шаги ---------- */
.steps{margin:0;padding:6px 0;list-style:none;background:var(--surface);border-radius:22px;counter-reset:s}
.steps li{counter-increment:s;padding:12px 18px 12px 60px;position:relative}
.steps li::before{content:counter(s);position:absolute;left:18px;top:11px;width:28px;height:28px;border-radius:9px;
  background:var(--tint);color:var(--accent);font:700 13px/28px var(--display);text-align:center}

/* ---------- страница решения ---------- */
.detail h1{font:700 24px/1.15 var(--display);margin:18px 4px 6px;letter-spacing:-.01em}
.detail .lead{color:var(--hint);margin:0 4px 6px}
.section{background:var(--surface);border-radius:22px;padding:16px 18px;margin-top:12px}
.section h3{font:500 15px/1.3 var(--display);margin:0 0 8px}
.section ul{margin:0;padding-left:20px}
.section li{margin:5px 0}
.caption{color:var(--hint);font-size:13px;margin:8px 4px 0}
.back{border:0;background:none;color:var(--link);padding:4px 0;cursor:pointer}

.fallback{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg)}
.fallback a{display:block;max-width:528px;margin:0 auto;text-align:center;padding:14px;border-radius:16px;background:var(--accent);color:var(--on-accent);font-weight:600}
.hidden{display:none}

/* единственное «живое» место: на странице решения экран собирается по шагам */
@media (prefers-reduced-motion:no-preference){
  .big .screen > *{opacity:0;transform:translateY(6px);animation:pop .35s ease-out forwards}
  .big .screen > *:nth-child(2){animation-delay:.25s}
  .big .screen > *:nth-child(3){animation-delay:.5s}
  .big .screen > *:nth-child(4){animation-delay:.75s}
  @keyframes pop{to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<div class="fallback hidden" id="fallback"><a id="contact" href="#" target="_blank" rel="noopener">Обсудить задачу в Telegram</a></div>
<script>
(function () {
  const W = window.Telegram && window.Telegram.WebApp;
  const tg = W && W.platform && W.platform !== "unknown" ? W : null;
  if (tg) { document.documentElement.classList.add("tg"); tg.ready(); tg.expand(); }

  const app = document.getElementById("app");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  let data = null;

  // Макеты — иллюстрации того, как решение выглядит у клиента (не скриншоты чужих проектов)
  const MOCKS = {
    "ai-assistant": `
      <div class="msg me">Сколько стоит чистка зубов и можно ли в субботу?<small>Клиент</small></div>
      <div class="msg bot">Профессиональная гигиена — 4 500 ₽. В субботу есть окна в 11:00 и 15:30. Записать вас?<small>Ассистент, по прайсу клиники</small></div>
      <div class="msg me">Да, на 11:00</div>`,
    "telegram-bot": `
      <div class="ticket"><div><b>Тариф «Месяц»</b><br><span style="color:var(--hint)">Доступ в закрытый канал</span></div><span class="pill">990 ₽</span></div>
      <div class="ticket"><span>Оплата прошла</span><span class="ok">Готово</span></div>
      <div class="msg bot">Вот ваша ссылка в канал. Напомню за 3 дня до окончания.</div>`,
    "marketplace-parser": `
      <div class="sheet">
        <div class="row"><span>Товар</span><span>Цена</span><span>За сутки</span></div>
        <div class="row"><span>Кофемолка, конкурент A</span><span>3 490</span><span class="down">−210</span></div>
        <div class="row"><span>Кофемолка, конкурент B</span><span>3 750</span><span class="up">+150</span></div>
        <div class="row"><span>Ваша кофемолка</span><span>3 690</span><span>0</span></div>
      </div>`,
    "crm-integration": `
      <div class="flow">
        <div class="box"><small>Заявка с сайта</small>Анна, +7 9••, «нужна кухня»</div>
        <div class="arrow" aria-hidden="true"></div>
        <div class="box"><small>Сделка в CRM</small>Новая, источник: реклама</div>
      </div>
      <div class="notice"><span class="dot" aria-hidden="true"></span>Менеджеру в Telegram: новая заявка, ответить до 10 минут</div>`,
    "ai-1c": `
      <div class="msg me">Сколько отгрузили «Ромашке» в октябре?</div>
      <div class="answer"><div class="num">412 800 ₽</div>17 отгрузок, на 12% больше сентября<small>Источник: отчёт «Продажи» в 1С</small></div>`,
    "website": `
      <div class="browser"><div class="bar" aria-hidden="true"><i></i><i></i><i></i><span></span></div>
        <div class="page"><div><h4>Ремонт квартир под ключ</h4><div class="lines" aria-hidden="true"><span></span><span></span></div></div><div class="cta">Рассчитать смету</div></div>
      </div>
      <div class="notice"><span class="dot" aria-hidden="true"></span>Заявка ушла в CRM и в Telegram</div>`,
    "lead-radar": `
      <div class="radar"><span class="score">86</span><div class="t">Нужен бот записи для барбершопа</div><div class="meta">Kwork, бюджет 40 000 ₽, 4 мин назад</div></div>
      <div class="msg bot">Черновик отклика готов: суть задачи, план и один вопрос заказчику</div>`,
  };
  const mock = (id) => MOCKS[id] ? `<div class="screen" aria-hidden="true">${MOCKS[id]}</div>` : "";

  const contactUrl = () => "https://t.me/" + encodeURIComponent(data.profile.telegram || "");
  function setupContact() {
    if (tg) {
      tg.MainButton.setText("Обсудить задачу");
      tg.MainButton.onClick(() => tg.openTelegramLink(contactUrl()));
      tg.MainButton.show();
      tg.BackButton.onClick(() => { location.hash = ""; });
    } else {
      document.getElementById("contact").href = contactUrl();
      document.getElementById("fallback").classList.remove("hidden");
    }
  }

  function solutionCard(s) {
    const badge = s.demo_url ? `<span class="badge">Есть демо</span>` : `<span class="badge muted">Демо готовлю</span>`;
    return `<button class="card" data-go="s/${esc(s.id)}">${mock(s.id)}
      <div class="card-body"><div class="card-title">${esc(s.title)}</div><div class="card-text">${esc(s.short)}</div>${badge}</div></button>`;
  }
  function projectCard(c) {
    return `<button class="card project" data-go="case/${esc(c.id)}">${mock(c.id)}
      <div class="card-body"><div class="card-title">${esc(c.title)}</div><div class="card-text">${esc(c.short || c.summary)}</div>
      ${c.metric ? `<span class="badge">${esc(c.metric.v)} ${esc(c.metric.l)}</span>` : ""}</div></button>`;
  }

  function home() {
    const p = data.profile;
    const initials = (p.name || "?").split(/\s+/).map((w) => w[0]).slice(0, 2).join("");
    const ava = p.photo ? `<img class="ava" src="${esc(p.photo)}" alt="">` : `<div class="ava" aria-hidden="true">${esc(initials)}</div>`;
    const sols = data.solutions || [];
    const own = (data.cases || []).filter((c) => c.kind !== "demo");
    app.innerHTML = `
      <section class="hero">
        <div class="hero-top">${ava}<div><h1 class="name">${esc(p.name)}</h1><div class="role">${esc(p.role)}</div></div></div>
        <p class="about">${esc(p.about)}</p>
        ${p.location ? `<p class="where">${esc(p.location)}</p>` : ""}
      </section>
      ${sols.length ? `<h2>Что могу сделать для вашего бизнеса</h2><p class="sub">Нажмите на карточку — там состав работ и кому подходит</p>
        <div class="grid">${sols.map(solutionCard).join("")}</div>` : ""}
      ${own.length ? `<h2>Мои проекты</h2><div class="grid">${own.map(projectCard).join("")}</div>` : ""}
      <h2>Как работаю</h2>
      <ol class="steps">${p.process.map((s) => `<li>${esc(s)}</li>`).join("")}</ol>`;
    bind();
    if (tg) tg.BackButton.hide();
    window.scrollTo(0, 0);
  }

  function page(item, sections) {
    app.innerHTML = `<div class="detail">
      ${tg ? "" : `<button class="back" data-go="">← Назад</button>`}
      <h1>${esc(item.title)}</h1><p class="lead">${esc(item.short || "")}</p>
      ${MOCKS[item.id] ? `<div class="big">${mock(item.id)}<p class="caption">${data.cases.some((c) => c.id === item.id) ? "Как это выглядит" : "Пример того, как это может выглядеть у вас"}</p></div>` : ""}
      ${sections.filter(Boolean).join("")}
    </div>`;
    bind();
    if (tg) tg.BackButton.show();
    window.scrollTo(0, 0);
  }
  const list = (title, items) => items && items.length ? `<div class="section"><h3>${esc(title)}</h3><ul>${items.map((i) => `<li>${esc(i)}</li>`).join("")}</ul></div>` : "";
  const text = (title, t) => t ? `<div class="section"><h3>${esc(title)}</h3><p>${esc(t)}</p></div>` : "";

  function solution(id) {
    const s = (data.solutions || []).find((x) => x.id === id);
    if (!s) return home();
    page(s, [
      text("Какую задачу решает", s.pain),
      list("Что входит", s.includes),
      text("Кому подойдёт", s.fit),
      s.demo_url ? `<div class="section"><a href="${esc(s.demo_url)}" target="_blank" rel="noopener">Попробовать демо</a></div>` : "",
      text("Как начнём", "Напишите пару строк о задаче. Задам вопросы и предложу решение, срок и цену."),
    ]);
  }
  function project(id) {
    const c = (data.cases || []).find((x) => x.id === id);
    if (!c) return home();
    page(c, [
      text("Задача", c.task), list("Что сделано", c.did), list("Результат", c.facts), text("Стек", c.stack),
      c.url ? `<div class="section"><a href="${esc(c.url)}" target="_blank" rel="noopener">Подробнее о проекте</a></div>` : "",
    ]);
  }

  function bind() {
    app.querySelectorAll("[data-go]").forEach((el) => el.addEventListener("click", () => { location.hash = el.dataset.go; }));
  }
  function route() {
    const m = location.hash.match(/^#(case|s)\/([\w-]+)/);
    if (!m) return home();
    return m[1] === "case" ? project(m[2]) : solution(m[2]);
  }

  fetch("portfolio.json", { cache: "no-cache" })
    .then((r) => r.json())
    .then((d) => {
      data = d;
      document.title = d.profile.name + " — портфолио";
      setupContact();
      // t.me/<бот>/<app>?startapp=<id> открывает сразу нужную карточку
      const start = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
      if (start && !location.hash) location.hash = ((d.cases || []).some((c) => c.id === start) ? "case/" : "s/") + start;
      window.addEventListener("hashchange", route);
      route();
    })
    .catch(() => { app.innerHTML = '<p class="about">Не удалось загрузить портфолио. Обновите страницу.</p>'; });
})();
</script>
</body>
</html>
